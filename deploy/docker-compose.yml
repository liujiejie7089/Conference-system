# AIOA 一期 · 基础设施 + 服务编排
# 使用：cp .env.example .env && docker compose up -d
#
# 数据库连接：localhost:3306  root/无密码  （与本地开发环境一致）

version: "3.9"

services:
  # ---------- 数据库 ----------
  mysql:
    image: mysql:8.0
    container_name: aioa-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_HOST: "%"
      MYSQL_ROOT_PASSWORD: ""
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      TZ: Asia/Singapore
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --lower_case_table_names=1
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot"]
      interval: 5s
      timeout: 3s
      retries: 30

  # ---------- 缓存 ----------
  redis:
    image: redis:7-alpine
    container_name: aioa-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ---------- AgentScope Python 服务（agent-svc 通过 HTTP 调用）----------
  # 由 vendor/agentscope 提供代码，Dockerfile 在 vendor/agentscope/Dockerfile
  agentscope:
    build:
      context: ../vendor/agentscope
      dockerfile: Dockerfile
    container_name: aioa-agentscope
    restart: unless-stopped
    environment:
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      AIOA_AGENT_URL: http://agentscope:8000
    ports:
      - "8001:8000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  mysql_data:
  redis_data:
